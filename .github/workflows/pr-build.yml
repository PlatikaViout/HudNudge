name: HudNudge Builder

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          $dalamudPath = "$env:APPDATA\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dalamudPath | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "latest.zip"
          Expand-Archive -Force "latest.zip" $dalamudPath

      - name: Build
        run: dotnet build HudNudge.sln --configuration Release

      - name: Store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HudNudge
          path: HudNudge/bin/x64/Release/HudNudge/*
          if-no-files-found: error
          retention-days: 7